services:
  frontend:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: comunidad_gamer
      DB_USER: eventos_dev
      DB_PASSWORD: ${MYSQL_PASSWORD:-eventos_dev_password}
    expose:
      - "8080"
    networks:
      - web
      - data

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: comunidad_gamer
      MYSQL_USER: eventos_dev
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-eventos_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-eventos_dev_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/eventos.sql:/docker-entrypoint-initdb.d/01-eventos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - data

volumes:
  mysql_data:

networks:
  web:
  data:
    internal: true
